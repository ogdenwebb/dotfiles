# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe -march=x86-64-v3"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"

# If left undefined, Portage's default behavior is to:
# - set the MAKEOPTS jobs value to the same number of threads returned by `nproc`
# - set the MAKEOPTS load-average value slightly above the number of threads returned by `nproc`, due to it being a damped value
# Please replace '4' as appropriate for the system (min(RAM/2GB, threads), or leave it unset.
# MAKEOPTS="-j4 -l5"
MAKEOPTS="-j8"

FEATURES="${FEATURES} getbinpkg"

# NOTE: This stage was built with the bindist USE flag enabled
USE="dist-kernel \
wayland pipewire gstreamer \
vulkan \
-vlc \
zsh zsh-complection"

# ACCEPT_KEYWORDS="~amd64"

# USE Multilib
# ABI_X86 = "64 32"

# Do not install systemd-related files
INSTALL_MASK="/lib/systemd /usr/lib/systemd"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE ValveSteamLicense Obsidian-EULA CC-BY-ND-3.0 dropbox"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8
